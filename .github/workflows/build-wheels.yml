name: Build Wheels
on:
  workflow_dispatch: # Manual trigger only

# Ad-hoc wheel build for the sedona-integration fork. Produces a manylinux_2_28
# AARCH64 free-threaded (cp314t, no-GIL) wheel for running Sail-instead-of-Spark
# jobs on Wherobots under a free-threaded CPython 3.14t runtime. The Wherobots
# Micro runtime is ARM (Graviton), so the wheel must be aarch64.
#
# Built natively on an ARM runner. maturin builds inside a manylinux_2_28
# (AlmaLinux 8, aarch64) container that ships python3.14t but is missing a recent
# protoc (prost-build needs one newer than AlmaLinux 8 ships) and a recent GEOS
# (the `geos` crate is pinned to v3_12_0 with no `static` feature, so it links
# system GEOS via geos-config, and AlmaLinux 8's package is too old). The
# before-script-linux installs both into the container. pyo3 ignores the pyproject
# abi3-py38 feature for the free-threaded interpreter, producing a cp314t wheel.
jobs:
  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The "t" suffix selects the free-threaded (no-GIL) interpreter.
          python-version: "3.14t"

      - name: Resolve protoc version
        id: protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: PyO3/maturin-action@v1
        env:
          # Fat LTO on the sail-python cdylib (arrow + datafusion + sedona) OOM-kills
          # the final link on the 16 GB ARM runner. Thin LTO keeps most of the perf
          # at a fraction of the peak memory.
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        with:
          command: build
          target: aarch64
          args: --release --out dist --interpreter python3.14t
          rustup-components: rustfmt
          manylinux: "2_28"
          before-script-linux: |
            set -euxo pipefail
            yum install -y wget unzip pkgconfig cmake gcc-c++ make
            # protoc (match the host-resolved version; AlmaLinux 8's is too old)
            protoc_version="${{ steps.protoc.outputs.version }}"
            protoc_version="${protoc_version#v}"
            wget -q -O /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${protoc_version}/protoc-${protoc_version}-linux-aarch_64.zip"
            unzip -o /tmp/protoc.zip -d /usr/local 'bin/*' 'include/*'
            protoc --version
            # GEOS >= 3.12 from source (the geos crate is pinned to v3_12_0 and links
            # system GEOS; AlmaLinux 8 packages are older than 3.12)
            geos_version="3.12.2"
            wget -q -O /tmp/geos.tar.bz2 "https://download.osgeo.org/geos/geos-${geos_version}.tar.bz2"
            tar xf /tmp/geos.tar.bz2 -C /tmp
            cmake -S "/tmp/geos-${geos_version}" -B /tmp/geos-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build /tmp/geos-build -j"$(nproc)" --target install
            echo /usr/local/lib > /etc/ld.so.conf.d/geos.conf
            echo /usr/local/lib64 >> /etc/ld.so.conf.d/geos.conf
            ldconfig
            geos-config --version

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-aarch64-freethreaded
          path: dist/*.whl
          retention-days: 3
