name: Build Wheels
on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          # Pin one CPython for a reproducible build; the wheel is abi3, so
          # it runs on any Python >= 3.8.
          args: --release --out dist -i python3.11
          manylinux: "2_28"
          sccache: true
          # The build runs inside the manylinux container, so GEOS must be
          # installed there (host apt packages are not visible). Mirrors
          # build-linux-wheel.sh.
          before-script-linux: |
            set -e
            dnf install -y cmake openssl-devel perl-IPC-Cmd unzip 2>/dev/null || \
              yum install -y cmake3 openssl-devel unzip 2>/dev/null || true
            # The distro protoc is too old (no --experimental_allow_proto3_optional);
            # install a modern one from GitHub releases.
            curl -sL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
            unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
            export PROTOC=/usr/local/bin/protoc
            if ! pkg-config --exists geos 2>/dev/null; then
              echo "Building GEOS from source..."
              curl -L https://download.osgeo.org/geos/geos-3.13.1.tar.bz2 | tar xj --no-same-owner
              cd geos-3.13.1
              mkdir -p build && cd build
              cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
              make -j$(nproc)
              make install
              cd ../..
            fi
            export PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH
            export LD_LIBRARY_PATH=/usr/local/lib64:/usr/local/lib:$LD_LIBRARY_PATH

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl

  # Free-threaded (no-GIL) wheel. Not abi3: pyo3 automatically drops the
  # `abi3-py38` feature when building for a free-threaded interpreter, so
  # maturin emits a versioned cp314t wheel. The build recipe (GEOS, protoc)
  # is otherwise identical to the abi3 job. See FREE_THREADING.md.
  build-linux-x86_64-freethreaded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          # The manylinux 2_28 container ships free-threaded CPython at
          # /opt/python/cp314-cp314t; maturin resolves it via `-i python3.14t`.
          args: --release --out dist -i python3.14t
          manylinux: "2_28"
          sccache: true
          before-script-linux: |
            set -e
            dnf install -y cmake openssl-devel perl-IPC-Cmd unzip 2>/dev/null || \
              yum install -y cmake3 openssl-devel unzip 2>/dev/null || true
            # The distro protoc is too old (no --experimental_allow_proto3_optional);
            # install a modern one from GitHub releases.
            curl -sL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
            unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
            export PROTOC=/usr/local/bin/protoc
            if ! pkg-config --exists geos 2>/dev/null; then
              echo "Building GEOS from source..."
              curl -L https://download.osgeo.org/geos/geos-3.13.1.tar.bz2 | tar xj --no-same-owner
              cd geos-3.13.1
              mkdir -p build && cd build
              cmake .. -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
              make -j$(nproc)
              make install
              cd ../..
            fi
            export PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH
            export LD_LIBRARY_PATH=/usr/local/lib64:/usr/local/lib:$LD_LIBRARY_PATH

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64-cp314t
          path: dist/*.whl

  build-macos-arm64:
    runs-on: macos-14  # arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install GEOS and protoc
        run: brew install geos protobuf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -i python3.11
          sccache: true

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64
          path: dist/*.whl

  # Free-threaded (no-GIL) wheel; see the linux free-threaded job above.
  build-macos-arm64-freethreaded:
    runs-on: macos-14  # arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install GEOS and protoc
        run: brew install geos protobuf

      - uses: actions/setup-python@v5
        with:
          # The "t" suffix selects the free-threaded build (setup-python >= v5.3).
          python-version: "3.14t"

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist -i python3.14t
          sccache: true

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64-cp314t
          path: dist/*.whl
