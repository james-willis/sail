[package]
name = "sail-sedona"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# `proj` uses sedona-proj with default-features off: libproj is dlopen'd at
# runtime (e.g. from the pyproj wheel), so builds need no PROJ toolchain.
default = ["geo", "geos", "tg", "proj"]
geo = ["dep:sedona-geo"]
geos = ["dep:sedona-geos"]
tg = ["dep:sedona-tg"]
proj = ["dep:sedona-proj"]
raster = ["dep:sedona-raster-functions"]

[dependencies]
datafusion = { workspace = true }
datafusion-common = { workspace = true }
datafusion-expr = { workspace = true }
lazy_static = { workspace = true }

# SedonaDB core crates (always required)
sedona-common = { workspace = true }
sedona-expr = { workspace = true }
sedona-functions = { workspace = true }
# Optional function crates
sedona-geo = { workspace = true, optional = true }
sedona-geos = { workspace = true, optional = true }
sedona-tg = { workspace = true, optional = true }
sedona-proj = { workspace = true, default-features = false, optional = true }
sedona-raster-functions = { workspace = true, optional = true }
